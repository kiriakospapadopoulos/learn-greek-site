<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Greek - Choose Your Path</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bounce {
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    body {
      background: url('Photos/greece1.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    /* Overlay for better readability */
    .overlay {
      background-color: rgba(0, 0, 0, 0.5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="overlay">

    <!-- NAVBAR -->
    <nav class="flex justify-between items-center p-6 bg-white bg-opacity-30 backdrop-blur-md">
      <h1 class="text-2xl font-bold text-blue-100 select-none">Learn Greek</h1>
      <div class="flex gap-4">
        <button id="lang-en" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-500 transition">EN</button>
        <button id="lang-gr" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-500 transition">GR</button>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex flex-col justify-center items-center flex-grow text-center px-6">
      <h1 id="main-title" class="text-white text-5xl md:text-6xl font-extrabold mb-16 mt-12">
        Choose Your Path
      </h1>

      <div class="flex flex-col md:flex-row gap-12 md:gap-24 items-center">

        <!-- Foreigner Button -->
        <a id="btn-foreigner"
           href="home.html"
           class="bounce bg-blue-600 hover:bg-blue-500 text-white font-bold text-3xl py-10 px-16 rounded-xl shadow-lg transition-transform transform hover:scale-105 w-96 h-32 flex items-center justify-center">
          Foreigner
        </a>

        <!-- Greek Button -->
        <a id="btn-greek"
           href="home.html"
           class="bounce bg-green-600 hover:bg-green-500 text-white font-bold text-3xl py-10 px-16 rounded-xl shadow-lg transition-transform transform hover:scale-105 w-96 h-32 flex items-center justify-center">
          🇬🇷 Greeks teaching Greek to their children
        </a>

      </div>
    </main>

  </div>

  <script>
    // LANGUAGE SWITCHER
    const langEN = document.getElementById('lang-en');
    const langGR = document.getElementById('lang-gr');
    const mainTitle = document.getElementById('main-title');
    const btnForeigner = document.getElementById('btn-foreigner');
    const btnGreekText = document.getElementById('btn-greek');

    const texts = {
      en: {
        title: "I am",
        foreigner: "Foreigner",
        greek: "Greek",
      },
      gr: {
        title: "Είμαι",
        foreigner: "Ξένος",
        greek: "Έλληνας",
      }
    };

    // Default language: English
    mainTitle.textContent = texts.en.title;
    btnForeigner.textContent = texts.en.foreigner;
    btnGreekText.textContent = texts.en.greek;

    langEN.addEventListener('click', () => {
      mainTitle.textContent = texts.en.title;
      btnForeigner.textContent = texts.en.foreigner;
      btnGreekText.textContent = texts.en.greek;
    });

    langGR.addEventListener('click', () => {
      mainTitle.textContent = texts.gr.title;
      btnForeigner.textContent = texts.gr.foreigner;
      btnGreekText.textContent = texts.gr.greek;
    });
  </script>

</body>
</html>
